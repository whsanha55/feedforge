spring:
  application:
    name: feedforge
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"

feedforge:
  security:
    access-token: ${FEEDFORGE_ACCESS_TOKEN:}
  collect:
    zod:
      enabled: ${FEEDFORGE_ZOD_ENABLED:true}
