server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api 접두사를 제거하고 Spring Boot 앱으로 프록시한다.
    # 업스트림은 요청 시점에 Docker 내장 DNS(127.0.0.11)로 resolve해서
    # app 서버가 아직 없어도 nginx가 기동하게 한다.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $feedforge_upstream http://app:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $feedforge_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
