services:
  postgres:
    image: postgres:16
    container_name: feedforge-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: feedforge
      POSTGRES_PASSWORD: feedforge
      POSTGRES_DB: feedforge
    volumes:
      - feedforge-postgres-dev-data:/var/lib/postgresql/data

volumes:
  feedforge-postgres-dev-data:
